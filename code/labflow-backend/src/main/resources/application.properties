spring.application.name=labflow

# HS256 signing key: must be >= 32 UTF-8 bytes. Same value across process restarts or existing JWTs become invalid.
# Override in production with a strong secret (e.g. env JWT_SIGNING_SECRET).
labflow.jwt.secret=${JWT_SIGNING_SECRET:labflow_dev_jwt_signing_secret_at_least_32b}

# Shared JPA tuning for all SQLite persistence units.
# create = drop and recreate schema on every application startup, then CommandLineRunners re-seed.
labflow.jpa.ddl-auto=create
labflow.jpa.show-sql=true

# --- Auth SQLite ---
auth.datasource.url=jdbc:sqlite:databases/auth.db

# --- Hematology SQLite ---
hematology.datasource.url=jdbc:sqlite:databases/hematology.db

# --- Microbiology module SQLite (reserved for new endpoints / entities) ---
microbiology.datasource.url=jdbc:sqlite:databases/microbiology.db
